<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arc – AEC Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
    <style>
        /* Same minimal, modern CSS as before */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            background: #0f0f0f;
            border-right: 1px solid #2a2a2a;
            padding: 24px 16px;
            flex-shrink: 0;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .sidebar .logo { font-size: 1.4rem; font-weight: 300; color: #e0e0e0; text-align: center; margin-bottom: 28px; letter-spacing: 2px; }
        .sidebar nav a {
            display: block;
            padding: 10px 14px;
            color: #888;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 4px;
            transition: background 0.2s, color 0.2s;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .sidebar nav a:hover { background: #1a1a1a; color: #ddd; }
        .sidebar nav a.active { background: #2a2a2a; color: #fff; }
        .sidebar .user-area {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid #2a2a2a;
            font-size: 0.9rem;
            color: #888;
        }
        .main {
            flex: 1;
            padding: 24px 32px 40px;
            overflow-y: auto;
            max-height: 100vh;
        }
        .glass-panel {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 24px;
        }
        .btn {
            background: #2a2a2a;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 20px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #3a3a3a; }
        input, select {
            background: transparent !important;
            border: 1px solid #333 !important;
            border-radius: 6px;
            color: #e0e0e0 !important;
            padding: 8px 12px;
            width: 100%;
            font-family: inherit;
            font-size: 0.95rem;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 16px;
            align-items: end;
        }
        .form-grid .field { display: flex; flex-direction: column; gap: 4px; }
        .form-grid .field label { font-size: 0.8rem; color: #888; }
        .concept-card {
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
        }
        .concept-card .head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .concept-card .head h4 { color: #aaa; margin: 0; }
        .concept-card .score { color: #888; font-weight: 600; }
        .concept-card .detail { font-size: 0.9rem; color: #888; }
        .concept-card .progress { background: #222; border-radius: 5px; height: 6px; width: 100%; margin: 6px 0; }
        .concept-card .progress .fill { background: #888; height: 100%; border-radius: 5px; }
        .concept-card .footer { display: flex; justify-content: space-between; font-size: 0.8rem; color: #666; margin-top: 4px; }
        .metrics { display: flex; gap: 24px; flex-wrap: wrap; }
        .metrics .metric { background: #1a1a1a; padding: 12px 20px; border-radius: 12px; flex: 1; min-width: 100px; text-align: center; }
        .metrics .metric .value { font-size: 1.8rem; font-weight: 600; color: #ccc; }
        .metrics .metric .label { font-size: 0.8rem; color: #888; }
        #ram-response { background: #1a1a1a; border-radius: 12px; padding: 16px; margin-top: 12px; white-space: pre-wrap; color: #aaa; border-left: 3px solid #555; }
        .hidden { display: none !important; }
        .mt-12 { margin-top: 12px; }
        .flex { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid #2a2a2a; padding: 16px; }
            .main { max-height: none; padding: 16px; }
            .form-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">Arc</div>
        <nav>
            <a href="#" class="active" data-tab="concepts">Concepts</a>
            <a href="#" data-tab="ram">Ram AI</a>
        </nav>
        <div class="user-area">
            <div>Guest</div>
        </div>
    </div>

    <!-- Main content -->
    <div class="main">
        <!-- Concepts tab -->
        <div id="tab-concepts">
            <div class="glass-panel">
                <h2>Evolution Engine</h2>
                <p style="color:#888;">Configure and generate 4 unique design concepts.</p>
                <div class="form-grid" id="concept-form">
                    <div class="field"><label>Country</label><select id="gen-country">
                        <option>Kenya</option><option>Uganda</option><option>Tanzania</option>
                        <option>South Sudan</option><option>Rwanda</option><option>Ethiopia</option>
                    </select></div>
                    <div class="field"><label>Domain</label><select id="gen-domain">
                        <option>Residential</option><option>Commercial</option><option>Industrial</option>
                    </select></div>
                    <div class="field"><label>Typology</label><select id="gen-typology">
                        <option>Luxury Villa</option><option>Modern Apartment</option><option>Townhouse Studio</option>
                        <option>Corporate Hub Block</option><option>Boutique Retail Space</option><option>Medical Clinic Center</option>
                        <option>Distribution Depot</option><option>Heavy Machinery Plant Warehouse</option>
                    </select></div>
                    <div class="field"><label>Plot Area (m²)</label><input type="number" id="gen-plot" value="800" /></div>
                    <div class="field"><label>Floors</label><input type="number" id="gen-floors" value="3" /></div>
                    <div class="field"><label>Bathrooms</label><input type="number" id="gen-baths" value="2" /></div>
                    <div class="field"><label>Soil</label><select id="gen-soil"></select></div>
                    <div class="field"><label>Room Types</label><select id="gen-rooms" multiple></select></div>
                    <div class="field" style="justify-content:flex-end;"><button class="btn" onclick="generate()">Generate Concepts</button></div>
                </div>
                <div id="concepts-output" class="hidden mt-12"><div id="concepts-container"></div></div>
            </div>
        </div>

        <!-- Ram AI tab -->
        <div id="tab-ram" class="hidden">
            <div class="glass-panel">
                <h2>Ram AI</h2>
                <p style="color:#888;">Ask Ram about construction, soil, costs, or design.</p>
                <div style="display:flex; gap:12px; margin-top:12px;">
                    <input type="text" id="ram-question" placeholder="Ask Ram..." style="flex:1;" />
                    <button class="btn" onclick="askRam()">Ask</button>
                </div>
                <div id="ram-response"></div>
            </div>
        </div>
    </div>

    <script>
        // ─── Navigation ──────────────────────────────────────────
        document.querySelectorAll('.sidebar nav a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
                this.classList.add('active');
                const tab = this.dataset.tab;
                document.querySelectorAll('.main > div[id^="tab-"]').forEach(el => el.classList.add('hidden'));
                document.getElementById('tab-' + tab).classList.remove('hidden');
            });
        });

        // ─── Soil & room type options ──────────────────────────
        const soilMap = {
            Kenya: ['Nairobi Red Coffee Clay', 'Generic Firm Sandy Gravel', 'Generic Soft Silt / Clay', 'Generic Hard Rock / Laterite'],
            Uganda: ['Kampala Red Lateritic Clay', 'Wetland Silts (Kampala)', 'Generic Firm Sandy Gravel', 'Generic Hard Rock / Laterite'],
            Tanzania: ['Dar Coastal Sand / Coral Limestone', 'Generic Firm Sandy Gravel', 'Generic Soft Silt / Clay'],
            'South Sudan': ['Juba Black Cotton Soil (Expansive)', 'Generic Firm Sandy Gravel', 'Generic Hard Rock / Laterite'],
            Rwanda: ['Kigali Volcanic Andosols', 'Generic Firm Sandy Gravel', 'Generic Soft Silt / Clay'],
            Ethiopia: ['Addis Clayey Soils & Volcanic Tuff', 'Generic Firm Sandy Gravel', 'Generic Hard Rock / Laterite']
        };
        const roomOptions = ['Bedroom','Bathroom','Ensuite','Corridor','Balcony','Living Room','Kitchen','Dining Room','Office','Storage'];

        function updateSoilAndRooms() {
            const country = document.getElementById('gen-country').value;
            const soilSelect = document.getElementById('gen-soil');
            soilSelect.innerHTML = soilMap[country].map(s => `<option value="${s}">${s}</option>`).join('');
            const roomSelect = document.getElementById('gen-rooms');
            roomSelect.innerHTML = roomOptions.map(r => `<option value="${r}">${r}</option>`).join('');
            // Select default rooms
            const defaults = ['Bedroom','Bathroom','Living Room','Kitchen'];
            Array.from(roomSelect.options).forEach(opt => opt.selected = defaults.includes(opt.value));
        }
        document.getElementById('gen-country').addEventListener('change', updateSoilAndRooms);
        updateSoilAndRooms();

        // ─── Generate Concepts ──────────────────────────────────
        async function generate() {
            const payload = {
                country: document.getElementById('gen-country').value,
                domain: document.getElementById('gen-domain').value,
                typology: document.getElementById('gen-typology').value,
                plot_size: parseInt(document.getElementById('gen-plot').value) || 800,
                floors: parseInt(document.getElementById('gen-floors').value) || 3,
                baths: parseInt(document.getElementById('gen-baths').value) || 2,
                soil_name: document.getElementById('gen-soil').value,
                room_types: Array.from(document.getElementById('gen-rooms').selectedOptions).map(o => o.value)
            };
            const container = document.getElementById('concepts-container');
            container.innerHTML = '<p style="color:#888;">Generating concepts...</p>';
            document.getElementById('concepts-output').classList.remove('hidden');

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const concepts = await res.json();
                container.innerHTML = '';
                if (!concepts.length) { container.innerHTML = '<p style="color:#888;">No concepts generated.</p>'; return; }
                concepts.forEach((c, i) => {
                    const card = document.createElement('div');
                    card.className = 'concept-card';
                    card.innerHTML = `
                        <div class="head">
                            <h4>${c.type}</h4>
                            <span class="score">Composite: ${c.scores.composite}</span>
                        </div>
                        <div class="detail">${c.country} · ${c.floors} floors · ${c.total_gfa} m² · Soil: ${c.soil_name}</div>
                        <div class="detail">Arch: ${c.scores.arch}% · Struct: ${c.scores.struct}% · Sust: ${c.scores.sust}% · Cost: ${c.scores.cost}%</div>
                        <div class="progress"><div class="fill" style="width:${c.scores.composite}%;"></div></div>
                        <div class="footer"><span>${c.eurocode.uls_status}</span><span>USD ${c.total_usd.toLocaleString()}</span></div>
                    `;
                    container.appendChild(card);
                });
            } catch(e) {
                container.innerHTML = '<p style="color:#888;">Error generating concepts.</p>';
                console.error(e);
            }
        }

        // ─── Ram AI ──────────────────────────────────────────────
        async function askRam() {
            const q = document.getElementById('ram-question').value.trim();
            if (!q) return;
            const respDiv = document.getElementById('ram-response');
            respDiv.innerHTML = 'Thinking...';
            try {
                const res = await fetch('/api/ram', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ q, country: document.getElementById('gen-country').value, domain: document.getElementById('gen-domain').value })
                });
                const data = await res.json();
                respDiv.innerHTML = data.response.replace(/\*\*/g, '').replace(/\n/g, '<br>');
            } catch(e) {
                respDiv.innerHTML = 'Error contacting Ram AI.';
            }
        }
    </script>
</body>
</html>
